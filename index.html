<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="https://smsupermarket.shop/12312.jfif" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0709" />

    <title>NITE BANANA · من حولك، على بعد ثلاثة كيلومترات</title>
    <meta
      name="description"
      content="مجتمع ليلي داخل مدينتك. لقطات حقيقية في نطاق ثلاثة كيلومترات، بلا إضافة أصدقاء، مرّر لتشاهد. وجوه مخفية، ومغيّر صوت بالذكاء الاصطناعي، ورسائل تختفي بعد القراءة. للبالغين +18 فقط."
    />
    <meta name="robots" content="index,follow" />

    <!--
      Arabic only. Noto Sans Arabic carries the right glyphs and line height
      for the diacritics Arabic letters sit above and below.

      Loaded with preload + onload so it never blocks first paint:
      the page draws with system fonts first, then swaps.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
